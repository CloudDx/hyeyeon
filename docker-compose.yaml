services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: flash-tickets-rabbitmq
    ports:
      - "5672:5672"  # AMQP protocol port
      - "15672:15672" # Management UI port
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: flash-tickets-api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:app@postgres:5432/appdb}
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8080
      AWS_XRAY_DAEMON_ADDRESS: xray-daemon:2000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      xray-daemon:
        condition: service_started
    command: >
      sh -c "python -m app.init_db && uvicorn app.main:app --loop asyncio --host ${UVICORN_HOST:-0.0.0.0} --port ${UVICORN_PORT:-8080}"

  payment-service:
    build:
      context: ./payment_service
    container_name: flash-tickets-payment-service
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:app@postgres:5432/appdb}
      RABBITMQ_HOST: rabbitmq
      AWS_XRAY_DAEMON_ADDRESS: xray-daemon:2000
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      xray-daemon:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    command: >
      sh -c "uvicorn payment_service.main:app --host 0.0.0.0 --port 8081"

  postgres:
    image: postgres:16
    container_name: flash-tickets-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5544:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-appdb} -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 20

  xray-daemon:
    image: amazon/aws-xray-daemon:3.x
    container_name: flash-tickets-xray-daemon
    ports:
      - "2000:2000/udp"
      - "2000:2000/tcp"
    command: ["--bind", ":2000"]
    # For local testing with AWS, uncomment the following lines and add credentials to your .env file
    # environment:
    #   - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
    #   - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    #   - AWS_REGION=${AWS_REGION:-ap-northeast-2}

networks:
  default:
    name: flash-tickets-net

volumes:
  pgdata: